<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loyalty Test 🚨✈️💅</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap');

        body {
            background-color: #ffe6f2;
            /* Moving background pattern */
            background-image: radial-gradient(#ffb3d9 3px, transparent 3px);
            background-size: 40px 40px;
            animation: moveBackground 5s linear infinite;
            font-family: 'Quicksand', sans-serif;
            color: #d63384;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* Hide scrollbars for the flying jets */
            position: relative;
        }

        @keyframes moveBackground {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        /* --- 🚨 SCREEN SHAKE ANIMATION (FOR WRONG ANSWERS) 🚨 --- */
        .screen-shake {
            animation: shakeScreen 0.5s infinite;
        }

        @keyframes shakeScreen {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-2px, -3px) rotate(-1deg); }
            20% { transform: translate(-4px, 0px) rotate(1deg); }
            30% { transform: translate(4px, 3px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* --- ✈️ FLYING JETS ✈️ --- */
        .jet {
            position: absolute;
            font-size: 4rem;
            z-index: 0;
            pointer-events: none;
            text-shadow: 2px 2px 5px rgba(255, 105, 180, 0.5);
        }

        .jet1 {
            top: 10%;
            animation: flyRight 4s linear infinite;
        }
        .jet2 {
            bottom: 15%;
            animation: flyLeft 5s linear infinite;
            transform: scaleX(-1); /* Flips the jet */
        }
        .jet3 {
            top: 60%;
            animation: flyRight 3.5s linear infinite;
            font-size: 2.5rem;
        }

        @keyframes flyRight {
            0% { left: -20%; }
            100% { left: 120%; }
        }

        @keyframes flyLeft {
            0% { right: -20%; }
            100% { right: 120%; }
        }

        /* --- CUTE FLOATING STICKERS --- */
        .sticker {
            position: absolute;
            font-size: 3rem;
            animation: float 4s ease-in-out infinite alternate, spin 6s linear infinite;
            z-index: 0;
            pointer-events: none;
        }
        .s1 { top: 10%; left: 10%; animation-delay: 0s; }
        .s2 { top: 15%; right: 15%; animation-delay: 1s; font-size: 4rem; }
        .s3 { bottom: 15%; left: 15%; animation-delay: 2s; }
        .s4 { bottom: 10%; right: 10%; animation-delay: 0.5s; font-size: 3.5rem;}
        .s5 { top: 80%; left: 45%; animation-delay: 1.5s; }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-40px) scale(1.2); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- QUIZ CONTAINER --- */
        .quiz-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(255, 105, 180, 0.6);
            border: 5px dashed #ff66b3; /* Dashed border for extra pop */
            max-width: 550px;
            width: 90%;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: bounceIn 1s ease-out;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 { 
            font-size: 2rem; 
            margin-top: 0; 
            color: #ff3385; 
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #ffb3d9;
            animation: pulseTitle 1.5s infinite alternate;
        }

        @keyframes pulseTitle {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); color: #ff0066; }
        }

        .question { font-size: 1.3rem; margin-bottom: 25px; font-weight: 900; line-height: 1.4; }
        .options { display: flex; flex-direction: column; gap: 15px; }

        /* --- BUTTONS --- */
        button {
            background-color: #ffb3d9;
            color: white;
            border: 3px solid #ff80bf;
            padding: 15px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 #ff66b3;
            position: relative;
            overflow: hidden;
        }

        button:hover { 
            background-color: #ff80bf; 
            transform: translateY(-3px) scale(1.02); 
            box-shadow: 0 9px 0 #ff66b3; 
        }
        
        button:active { 
            transform: translateY(4px); 
            box-shadow: 0 2px 0 #ff66b3; 
        }

        .hidden { display: none; }
        #result { font-size: 1.5rem; font-weight: 900; color: #d63384; line-height: 1.6; }

        /* --- 😱 THE SCARY TRUMP OVERLAY 😱 --- */
        #trump-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        #trump-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        /* Spinning Danger Background */
        .danger-bg {
            position: absolute;
            width: 200vmax; height: 200vmax;
            background: repeating-conic-gradient(
                red 0deg 15deg, 
                black 15deg 30deg
            );
            opacity: 0.3;
            animation: spinDanger 10s linear infinite;
            z-index: -1;
        }

        @keyframes spinDanger {
            100% { transform: rotate(360deg); }
        }

        #trump-img {
            width: 350px; 
            height: 350px;
            object-fit: cover;
            border-radius: 50%;
            border: 10px solid red;
            box-shadow: 0 0 80px red;
        }

        .shake-hard {
            animation: scaryShake 0.1s infinite;
        }

        @keyframes scaryShake {
            0% { transform: translate(2px, 2px) rotate(0deg) scale(1.1); }
            20% { transform: translate(-5px, -5px) rotate(-5deg) scale(1.2); }
            40% { transform: translate(-5px, 5px) rotate(5deg) scale(1.1); }
            60% { transform: translate(5px, 5px) rotate(0deg) scale(1.3); }
            80% { transform: translate(5px, -5px) rotate(5deg) scale(1.15); }
            100% { transform: translate(-5px, -5px) rotate(-5deg) scale(1.2); }
        }

        .trump-text {
            color: red;
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            margin-top: 20px;
            text-shadow: 3px 3px 0 black, -2px -2px 0 white;
            animation: pulseTitle 0.5s infinite alternate;
        }

        #sorry-btn {
            margin-top: 30px;
            background-color: white;
            color: red;
            font-size: 1.8rem;
            font-weight: 900;
            border: 5px solid red;
            padding: 15px 40px;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 0 30px red;
            text-transform: uppercase;
        }
        
        #sorry-btn:hover {
            background-color: red;
            color: white;
            transform: scale(1.1);
        }

        /* Emojis popping up randomly */
        .pop-emoji {
            position: absolute;
            font-size: 3rem;
            animation: popUp 1s ease-out forwards;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes popUp {
            0% { transform: translateY(0) scale(0); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.5); opacity: 0; }
        }

    </style>
</head>
<body>

    <!-- ✈️ FLYING JETS ✈️ -->
    <div class="jet jet1">✈️</div>
    <div class="jet jet2">🛩️</div>
    <div class="jet jet3">✈️</div>

    <!-- Cute Floating Stickers -->
    <div class="sticker s1">💅</div>
    <div class="sticker s2">☕</div>
    <div class="sticker s3">👀</div>
    <div class="sticker s4">💖</div>
    <div class="sticker s5">🎀</div>

    <!-- The Quiz Box -->
    <div class="quiz-container" id="main-container">
        <h1>⚠️ LOYALTY TEST ⚠️</h1>
        
        <div id="quiz">
            <div class="question" id="question-text">Question here</div>
            <div class="options" id="options-container">
                <!-- Buttons will be generated here -->
            </div>
        </div>

        <div id="result" class="hidden">
            <p>CONGRATULATIONS! 🥰</p>
            <p>You passed the loyalty test. Your reward is unlimited hugs, kisses, and a private jet! ✈️💖</p>
            <div style="font-size: 4rem; animation: spin 2s infinite;">👑💖</div>
        </div>
    </div>

    <!-- 😱 THE SCARY TRUMP POPUP 😱 -->
    <div id="trump-overlay">
        <div class="danger-bg"></div>
        <!-- This image pulls a funny/shocked Trump picture from the web -->
        <img id="trump-img" src="https://media.tenor.com/8M567sN9j3AAAAAM/donald-trump-shocked.gif" alt="Scary Trump">
        <div class="trump-text">WRONG ANSWER!</div>
        <div class="trump-text" style="font-size: 1.5rem; color: white; margin-top: 10px;">You are in BIG trouble...</div>
        <button id="sorry-btn">OK I'M SORRY 😭</button>
    </div>

    <!-- The Quiz Logic -->
    <script>
        const questions = [
            {
                question: "Who was the last person you texted? 📱",
                options: ["a balaw ", "minion", "It was definitely YOU 🥺"],
                correct: 2 
            },
            {
                question: "hw did u spent ur day ? 👀",
                options: ["i told u", "chilling ", "Thinking about you (obviously)"],
                correct: 2
            },
            {
                question: "Someone is looking at you. What do you do? 🍸",
                options: ["Smile back awkwardly 😬", "Look at the floor 🧱", "stab them 20times"],
                correct: 1
            },
            {
                question: "What are you hiding in your phone? 🔍",
                options: ["F1 vids 🏎️", "An old ex's number 🚩", "Nothing, because my life is an open book for you 📖"],
                correct: 2
            },
            {
                question: "Why do you love me? ❤️",
                options: ["Because you're nice 🙂", "who said i love u", "Because you're the most perfect human on earth 👑"],
                correct: 2
            }
        ];

        let currentQuestionIndex = 0;
        
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const quizDiv = document.getElementById("quiz");
        const resultDiv = document.getElementById("result");
        const bodyElement = document.body;
        
        // Scary Trump Elements
        const trumpOverlay = document.getElementById("trump-overlay");
        const sorryBtn = document.getElementById("sorry-btn");
        const trumpImg = document.getElementById("trump-img");

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                showResult();
                return;
            }

            const currentQ = questions[currentQuestionIndex];
            questionText.innerText = currentQ.question;
            optionsContainer.innerHTML = "";

            currentQ.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.innerText = option;
                button.onclick = () => checkAnswer(index, button);
                optionsContainer.appendChild(button);
            });
        }

        // Spawns cute emojis flying up from the click position
        function spawnEmojis(x, y, emojiList) {
            for (let i = 0; i < 5; i++) {
                const emoji = document.createElement("div");
                emoji.className = "pop-emoji";
                emoji.innerText = emojiList[Math.floor(Math.random() * emojiList.length)];
                emoji.style.left = (x + (Math.random() * 50 - 25)) + "px";
                emoji.style.top = (y + (Math.random() * 50 - 25)) + "px";
                document.body.appendChild(emoji);
                
                // Remove from DOM after animation ends
                setTimeout(() => { emoji.remove(); }, 1000);
            }
        }

        function checkAnswer(selectedIndex, buttonElement) {
            const buttons = optionsContainer.querySelectorAll("button");
            buttons.forEach(btn => btn.disabled = true);

            // Get click coordinates for the pop animation
            const rect = buttonElement.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            if (selectedIndex === questions[currentQuestionIndex].correct) {
                // CORRECT ANSWER: Green, Pop Hearts
                buttonElement.style.backgroundColor = "#66cc99";
                buttonElement.style.borderColor = "#339966";
                buttonElement.style.boxShadow = "0 4px 0 #339966";
                
                spawnEmojis(x, y, ["💖", "✨", "🎉", "😍", "🌸"]);
                
                setTimeout(() => {
                    currentQuestionIndex++;
                    loadQuestion();
                }, 1200);

            } else {
                // WRONG ANSWER: CHAOS MODE
                buttonElement.style.backgroundColor = "#ff6666";
                buttonElement.style.borderColor = "#cc0000";
                buttonElement.style.boxShadow = "0 4px 0 #cc0000";
                
                // 1. Shake the whole website
                bodyElement.classList.add("screen-shake");
                
                // 2. Show the scary overlay
                trumpOverlay.classList.add("active");
                trumpImg.classList.add("shake-hard");
                
                // 3. Random red emojis
                spawnEmojis(window.innerWidth / 2, window.innerHeight / 2, ["🚨", "😱", "❌", "🚫", "👺"]);
            }
        }

        // When he clicks the "I'm sorry" button, hide Trump and try again
        sorryBtn.onclick = () => {
            // Stop the shaking
            bodyElement.classList.remove("screen-shake");
            trumpOverlay.classList.remove("active");
            trumpImg.classList.remove("shake-hard");
            
            // Let him try the same question again
            const buttons = optionsContainer.querySelectorAll("button");
            buttons.forEach(btn => {
                btn.disabled = false;
                btn.style.backgroundColor = ""; // Reset colors
                btn.style.borderColor = "";
                btn.style.boxShadow = "";
            });
        };

        function showResult() {
            quizDiv.classList.add("hidden");
            resultDiv.classList.remove("hidden");
            
            // Confetti explosion at the end
            for(let i=0; i<30; i++) {
                setTimeout(() => {
                    spawnEmojis(
                        Math.random() * window.innerWidth, 
                        window.innerHeight, 
                        ["🎉", "🎊", "💖", "✈️", "🏎️", "✨"]
                    );
                }, i * 100);
            }
        }

        loadQuestion();
    </script>
</body>
</html>
